              ${lines.map(l => `<svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"><line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="var(--warning)" stroke-width="2" stroke-dasharray="4,4"/></svg>`).join('')}
            </div>
            <div class="mindmap-zoom-controls">
              <button class="zoom-btn" onclick="app.zoomMindMap(1.2)">+</button>
              <button class="zoom-btn" onclick="app.zoomMindMap(0.8)">−</button>
              <button class="zoom-btn" onclick="app.resetMindMap()">⟲</button>
            </div>
          </div>
        `;
        container.innerHTML = html;
        const wrapper = document.getElementById('mindmapWrapper');
        if (wrapper) { wrapper.style.transform = 'scale(1)';
          wrapper.style.transformOrigin = 'top left'; }
      }
      zoomMindMap(factor) {
        const wrapper = document.getElementById('mindmapWrapper');
        if (!wrapper) return;
        const current = parseFloat(wrapper.style.transform.replace(/[^0-9.]/g, '') || '1');
        wrapper.style.transform = `scale(${Math.max(0.3, Math.min(3, current * factor))})`;
      }
      resetMindMap() {
        const wrapper = document.getElementById('mindmapWrapper');
        if (wrapper) wrapper.style.transform = 'scale(1)';
      }

      // ----- CONNEXIONS (PEERS) -----
      openConnectionModal() {
        document.getElementById('modalContainer').innerHTML = `
          <div class="modal-overlay active" onclick="if(event.target===this)app.closeModal()"><div class="modal-sheet"><div class="modal-handle"></div>
            <h3 class="modal-title">🔗 Connexion</h3>
            <div class="form-group"><label class="form-label">Votre code (à partager)</label><div class="code-display">${this.myCode}</div></div>
            <div class="form-group"><label class="form-label">Code du contact (à entrer)</label>
              <div style="display:flex;gap:8px;"><input type="text" class="form-input" id="peerCodeInput" placeholder="______" maxlength="6" inputmode="numeric" style="text-align:center;font-size:1.5rem;letter-spacing:8px;flex:1;"><button class="btn btn-primary" style="width:auto;" onclick="app.connectToPeer()">Connecter</button></div>
            </div>
            <div class="menu-divider"></div>
            <div class="form-group"><label class="form-label">Contacts (${this.connectedPeers.length})</label>
              ${this.connectedPeers.length === 0 ? '<p style="font-size:0.8rem;color:var(--text-muted);">Aucun contact</p>' : this.connectedPeers.map(p => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);"><span>👤 ${p.name || 'Contact '+p.code}</span><button class="btn btn-sm btn-danger" style="width:auto;padding:4px 8px;" onclick="app.disconnectPeer('${p.code}')">✕</button></div>`).join('')}
            </div>
          </div></div>`;
      }
      connectToPeer() {
        const code = document.getElementById('peerCodeInput').value.trim();
        if (code.length !== 6 || !/^\d{6}$/.test(code)) { this.showToast('Code invalide'); return; }
        if (code === this.myCode) { this.showToast('Code identique'); return; }
        if (this.connectedPeers.some(p => p.code === code)) { this.showToast('Déjà connecté'); return; }
        const name = prompt('Nom du contact :', 'Contact ' + code);
        this.connectedPeers.push({ code, name: name || 'Contact ' + code });
        if (!this.peersData[code]) this.peersData[code] = {
          tasks: [
            { id: 'p1', title: 'Tâche partagée 1', priority: 'high', completed: false },
            { id: 'p2', title: 'Tâche partagée 2', priority: 'medium', completed: true }
          ],
          lastSync: new Date().toISOString()
        };
        localStorage.setItem('connectedPeers', JSON.stringify(this.connectedPeers));
        localStorage.setItem('peersData', JSON.stringify(this.peersData));
        this.showToast('✅ Connecté');
        this.closeModal();
        this.render();
      }
      disconnectPeer(code) {
        this.connectedPeers = this.connectedPeers.filter(p => p.code !== code);
        delete this.peersData[code];
        localStorage.setItem('connectedPeers', JSON.stringify(this.connectedPeers));
        localStorage.setItem('peersData', JSON.stringify(this.peersData));
        this.showToast('🔌 Déconnecté');
        this.closeModal();
        this.render();
      }
      renderConnections(container) {
        let html =
          `<h3 style="margin-bottom:15px;">🔗 Connexions</h3><div style="background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:15px;border:1px solid var(--card-border);"><div class="form-label">Votre code</div><div class="code-display">${this.myCode}</div><button class="btn btn-primary" onclick="app.openConnectionModal()">Gérer</button></div>`;
        if (!this.connectedPeers.length) html +=
          `<div style="text-align:center;padding:40px;color:var(--text-muted);">🔗 Aucune connexion</div>`;
        else this.connectedPeers.forEach(peer => {
          const pd = this.peersData[peer.code] || { tasks: [] };
          const done = pd.tasks.filter(t => t.completed).length;
          html +=
            `<div style="background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:10px;border:1px solid var(--card-border);"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>👤 ${peer.name}</strong><span>${done}/${pd.tasks.length}</span></div><div style="display:flex;gap:6px;"><button class="btn btn-sm" style="width:auto;" onclick="app.showPeerTasks('${peer.code}')">📋 Tâches</button><button class="btn btn-sm btn-danger" style="width:auto;" onclick="app.disconnectPeer('${peer.code}')">🔌</button></div></div>`;
        });
        container.innerHTML = html;
      }
      showPeerTasks(code) {
        const peer = this.connectedPeers.find(p => p.code === code);
        const pd = this.peersData[code] || { tasks: [] };
        document.getElementById('modalContainer').innerHTML =
          `<div class="modal-overlay active"><div class="modal-sheet"><div class="modal-handle"></div><h3 class="modal-title">📋 Tâches de ${peer.name}</h3>${pd.tasks.map(t => `<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;"><span>${t.completed ? '✅' : '○'}</span><span style="flex:1;">${t.title}</span></div>`).join('')}</div></div>`;
      }

      // ----- EXPORT/IMPORT -----
      exportData(format) {
        if (format === 'csv') {
          let csv = 'Titre;Priorité;Date;Projet;Statut;Heures estimées\n';
          this.data.tasks.forEach(t => { csv +=
              `"${t.title}";${t.priority};${t.dueDate||''};${t.project||''};${t.status};${t.estimatedHours||0}\n`; });
          this.downloadFile(csv, 'taches.csv', 'text/csv');
        } else {
          this.downloadFile(JSON.stringify(this.data), 'backup.json', 'application/json');
        }
      }
      downloadFile(content, filename, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }
      importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const f = e.target.files[0];
          if (f) {
            const r = new FileReader();
            r.onload = (ev) => {
              try {
                this.data = JSON.parse(ev.target.result);
                this.saveData();
                this.render();
                this.showToast('✅ Importé');
              } catch (err) { this.showToast('❌ Invalide'); }
            };
            r.readAsText(f);
          }
        };
        input.click();
      }
    }

    // INIT
    const app = new UltraTodoApp();
  </script>
</body>
</html>
